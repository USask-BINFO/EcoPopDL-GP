<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="770" viewBox="0 0 1280 770" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#444"/>
    </marker>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1280" height="770" fill="#ffffff"/>

  <!-- title -->
  <text x="640" y="44" text-anchor="middle" font-size="30" font-weight="700" fill="#1a1a1a">How every embedding is built — 3 simple machines</text>
  <text x="640" y="76" text-anchor="middle" font-size="16.5" fill="#555">A neural network only does math on vectors. Each &#8220;embedding&#8221; is made by ONE of these three operations.</text>

  <!-- ===================== PANEL 1 : LOOKUP ===================== -->
  <rect x="30" y="110" width="380" height="505" rx="16" fill="#EAF2FB" stroke="#2F5C8F" stroke-width="2.5"/>
  <rect x="30" y="110" width="380" height="60" rx="16" fill="#2F5C8F"/>
  <text x="220" y="139" text-anchor="middle" font-size="23" font-weight="700" fill="#ffffff">&#9312;  LOOKUP TABLE</text>
  <text x="220" y="159" text-anchor="middle" font-size="13" fill="#cfe0f2">nn.Embedding</text>

  <text x="220" y="195" text-anchor="middle" font-size="14.5" font-weight="600" fill="#2F5C8F">INPUT: a category number</text>

  <!-- input pill -->
  <rect x="145" y="208" width="150" height="36" rx="18" fill="#ffffff" stroke="#2F5C8F" stroke-width="1.6"/>
  <text x="220" y="231" text-anchor="middle" font-size="16" font-weight="600" fill="#1a1a1a">dosage = 1</text>
  <line x1="220" y1="246" x2="220" y2="270" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- table 3 rows -->
  <text x="220" y="288" text-anchor="middle" font-size="12.5" fill="#555">grab the matching row</text>
  <g>
    <rect x="165" y="296" width="110" height="30" fill="#ffffff" stroke="#9bb6d4"/>
    <rect x="165" y="326" width="110" height="30" fill="#2F5C8F" stroke="#2F5C8F"/>
    <rect x="165" y="356" width="110" height="30" fill="#ffffff" stroke="#9bb6d4"/>
    <text x="152" y="316" text-anchor="end" font-size="13" fill="#777">0</text>
    <text x="152" y="346" text-anchor="end" font-size="13" font-weight="700" fill="#2F5C8F">1</text>
    <text x="152" y="376" text-anchor="end" font-size="13" fill="#777">2</text>
    <text x="220" y="345" text-anchor="middle" font-size="12" fill="#ffffff">row 1</text>
  </g>
  <line x1="220" y1="388" x2="220" y2="412" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- output vector -->
  <g>
    <rect x="154" y="416" width="22" height="22" fill="#cfe0f2" stroke="#2F5C8F"/>
    <rect x="176" y="416" width="22" height="22" fill="#cfe0f2" stroke="#2F5C8F"/>
    <rect x="198" y="416" width="22" height="22" fill="#cfe0f2" stroke="#2F5C8F"/>
    <rect x="220" y="416" width="22" height="22" fill="#cfe0f2" stroke="#2F5C8F"/>
    <rect x="242" y="416" width="22" height="22" fill="#cfe0f2" stroke="#2F5C8F"/>
    <rect x="264" y="416" width="22" height="22" fill="#cfe0f2" stroke="#2F5C8F"/>
  </g>
  <text x="220" y="462" text-anchor="middle" font-size="14" font-weight="600" fill="#1a1a1a">&#8594; a learned vector</text>

  <line x1="50" y1="556" x2="390" y2="556" stroke="#bcd0e6" stroke-width="1.2"/>
  <text x="220" y="578" text-anchor="middle" font-size="13" font-weight="700" fill="#2F5C8F">USED FOR</text>
  <text x="220" y="598" text-anchor="middle" font-size="13" fill="#333">dosage &#183; location &#183; year &#183; population</text>

  <!-- ===================== PANEL 2 : TRANSFORM ===================== -->
  <rect x="450" y="110" width="380" height="505" rx="16" fill="#E9F6EF" stroke="#2E7D54" stroke-width="2.5"/>
  <rect x="450" y="110" width="380" height="60" rx="16" fill="#2E7D54"/>
  <text x="640" y="139" text-anchor="middle" font-size="23" font-weight="700" fill="#ffffff">&#9313;  TRANSFORM</text>
  <text x="640" y="159" text-anchor="middle" font-size="13" fill="#cdeede">Linear / MLP</text>

  <text x="640" y="195" text-anchor="middle" font-size="14.5" font-weight="600" fill="#2E7D54">INPUT: a list of numbers</text>

  <!-- input 2 cells -->
  <g>
    <rect x="600" y="212" width="40" height="34" fill="#ffffff" stroke="#2E7D54"/>
    <rect x="640" y="212" width="40" height="34" fill="#ffffff" stroke="#2E7D54"/>
    <text x="620" y="235" text-anchor="middle" font-size="14" fill="#1a1a1a">42</text>
    <text x="660" y="235" text-anchor="middle" font-size="14" fill="#1a1a1a">9.0</text>
  </g>
  <text x="640" y="268" text-anchor="middle" font-size="12.5" fill="#555">e.g. [gene-dist, TE-dist]</text>
  <line x1="640" y1="276" x2="640" y2="300" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- matrix box -->
  <rect x="520" y="304" width="240" height="74" rx="12" fill="#ffffff" stroke="#2E7D54" stroke-width="1.8"/>
  <text x="640" y="340" text-anchor="middle" font-size="24" font-weight="700" fill="#1a1a1a">&#215; W</text>
  <text x="640" y="363" text-anchor="middle" font-size="13" fill="#555">multiply by a learned matrix</text>
  <line x1="640" y1="382" x2="640" y2="406" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- output vector -->
  <g>
    <rect x="574" y="410" width="22" height="22" fill="#cdeede" stroke="#2E7D54"/>
    <rect x="596" y="410" width="22" height="22" fill="#cdeede" stroke="#2E7D54"/>
    <rect x="618" y="410" width="22" height="22" fill="#cdeede" stroke="#2E7D54"/>
    <rect x="640" y="410" width="22" height="22" fill="#cdeede" stroke="#2E7D54"/>
    <rect x="662" y="410" width="22" height="22" fill="#cdeede" stroke="#2E7D54"/>
    <rect x="684" y="410" width="22" height="22" fill="#cdeede" stroke="#2E7D54"/>
  </g>
  <text x="640" y="456" text-anchor="middle" font-size="14" font-weight="600" fill="#1a1a1a">&#8594; a new vector</text>

  <line x1="470" y1="556" x2="810" y2="556" stroke="#bfe0cf" stroke-width="1.2"/>
  <text x="640" y="578" text-anchor="middle" font-size="13" font-weight="700" fill="#2E7D54">USED FOR</text>
  <text x="640" y="598" text-anchor="middle" font-size="13" fill="#333">distances &#183; flags &#183; BiLSTM &#183; projections</text>

  <!-- ===================== PANEL 3 : POOL ===================== -->
  <rect x="870" y="110" width="380" height="505" rx="16" fill="#FCF2E2" stroke="#C77D24" stroke-width="2.5"/>
  <rect x="870" y="110" width="380" height="60" rx="16" fill="#C77D24"/>
  <text x="1060" y="139" text-anchor="middle" font-size="23" font-weight="700" fill="#ffffff">&#9314;  POOL</text>
  <text x="1060" y="159" text-anchor="middle" font-size="13" fill="#f6e0c4">attention / average</text>

  <text x="1060" y="195" text-anchor="middle" font-size="14.5" font-weight="600" fill="#C77D24">INPUT: many vectors</text>

  <!-- three input rows with weights -->
  <g font-size="13" fill="#555">
    <text x="1000" y="227" text-anchor="end">&#215;0.05</text>
    <rect x="1012" y="214" width="20" height="18" fill="#ffffff" stroke="#C77D24"/>
    <rect x="1032" y="214" width="20" height="18" fill="#ffffff" stroke="#C77D24"/>
    <rect x="1052" y="214" width="20" height="18" fill="#ffffff" stroke="#C77D24"/>
    <rect x="1072" y="214" width="20" height="18" fill="#ffffff" stroke="#C77D24"/>

    <text x="1000" y="257" text-anchor="end" font-weight="700" fill="#C77D24">&#215;0.55</text>
    <rect x="1012" y="244" width="20" height="18" fill="#f3d6ab" stroke="#C77D24"/>
    <rect x="1032" y="244" width="20" height="18" fill="#f3d6ab" stroke="#C77D24"/>
    <rect x="1052" y="244" width="20" height="18" fill="#f3d6ab" stroke="#C77D24"/>
    <rect x="1072" y="244" width="20" height="18" fill="#f3d6ab" stroke="#C77D24"/>

    <text x="1000" y="287" text-anchor="end">&#215;0.10</text>
    <rect x="1012" y="274" width="20" height="18" fill="#ffffff" stroke="#C77D24"/>
    <rect x="1032" y="274" width="20" height="18" fill="#ffffff" stroke="#C77D24"/>
    <rect x="1052" y="274" width="20" height="18" fill="#ffffff" stroke="#C77D24"/>
    <rect x="1072" y="274" width="20" height="18" fill="#ffffff" stroke="#C77D24"/>
  </g>
  <text x="1060" y="307" text-anchor="middle" font-size="11.5" fill="#777">important ones get bigger weights</text>
  <line x1="1060" y1="312" x2="1060" y2="332" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- sum box -->
  <rect x="975" y="336" width="170" height="50" rx="12" fill="#ffffff" stroke="#C77D24" stroke-width="1.8"/>
  <text x="1060" y="367" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a1a">&#931;  weighted sum</text>
  <line x1="1060" y1="390" x2="1060" y2="412" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- output single vector -->
  <g>
    <rect x="1012" y="416" width="24" height="24" fill="#f3d6ab" stroke="#C77D24"/>
    <rect x="1036" y="416" width="24" height="24" fill="#f3d6ab" stroke="#C77D24"/>
    <rect x="1060" y="416" width="24" height="24" fill="#f3d6ab" stroke="#C77D24"/>
    <rect x="1084" y="416" width="24" height="24" fill="#f3d6ab" stroke="#C77D24"/>
  </g>
  <text x="1060" y="464" text-anchor="middle" font-size="14" font-weight="600" fill="#1a1a1a">&#8594; ONE summary vector</text>

  <line x1="890" y1="556" x2="1230" y2="556" stroke="#ecd3ad" stroke-width="1.2"/>
  <text x="1060" y="578" text-anchor="middle" font-size="13" font-weight="700" fill="#C77D24">USED FOR</text>
  <text x="1060" y="598" text-anchor="middle" font-size="13" fill="#333">block pooling &#183; genome g &#183; environment e</text>

  <!-- ===================== BOTTOM STRIP : COMPOSITION ===================== -->
  <text x="640" y="652" text-anchor="middle" font-size="16.5" font-weight="700" fill="#1a1a1a">In the model, each embedding just combines these machines:</text>

  <!-- chip 1 -->
  <rect x="50" y="668" width="224" height="66" rx="10" fill="#F4F5F7" stroke="#cccccc"/>
  <text x="162" y="694" text-anchor="middle" font-size="13.5" font-weight="600" fill="#333">SNP embedding (BAE)</text>
  <text x="162" y="720" text-anchor="middle" font-size="18" font-weight="700"><tspan fill="#2F5C8F">&#9312;</tspan><tspan fill="#333"> + </tspan><tspan fill="#2E7D54">&#9313;</tspan></text>

  <!-- chip 2 -->
  <rect x="289" y="668" width="224" height="66" rx="10" fill="#F4F5F7" stroke="#cccccc"/>
  <text x="401" y="694" text-anchor="middle" font-size="13.5" font-weight="600" fill="#333">Block tokens (HABE)</text>
  <text x="401" y="720" text-anchor="middle" font-size="18" font-weight="700"><tspan fill="#C77D24">&#9314;</tspan><tspan fill="#333"> + </tspan><tspan fill="#2F5C8F">&#9312;</tspan></text>

  <!-- chip 3 -->
  <rect x="528" y="668" width="224" height="66" rx="10" fill="#F4F5F7" stroke="#cccccc"/>
  <text x="640" y="694" text-anchor="middle" font-size="13.5" font-weight="600" fill="#333">Genome  g</text>
  <text x="640" y="720" text-anchor="middle" font-size="18" font-weight="700"><tspan fill="#C77D24">&#9314;</tspan></text>

  <!-- chip 4 -->
  <rect x="767" y="668" width="224" height="66" rx="10" fill="#F4F5F7" stroke="#cccccc"/>
  <text x="879" y="694" text-anchor="middle" font-size="13.5" font-weight="600" fill="#333">Location / Year / Pop</text>
  <text x="879" y="720" text-anchor="middle" font-size="18" font-weight="700"><tspan fill="#2F5C8F">&#9312;</tspan></text>

  <!-- chip 5 -->
  <rect x="1006" y="668" width="224" height="66" rx="10" fill="#F4F5F7" stroke="#cccccc"/>
  <text x="1118" y="694" text-anchor="middle" font-size="13.5" font-weight="600" fill="#333">Environment  e</text>
  <text x="1118" y="720" text-anchor="middle" font-size="18" font-weight="700"><tspan fill="#2E7D54">&#9313;</tspan><tspan fill="#333"> + </tspan><tspan fill="#C77D24">&#9314;</tspan></text>
</svg>
